appId: com.countryboysplay.claudecodemax
productName: ClaudeCodeMax
directories:
  output: dist
files:
  - out/**
  - package.json
asarUnpack:
  - node_modules/@lydell/**
extraResources:
  - from: resources/memory-hook.mjs
    to: memory-hook.mjs
win:
  target: nsis
  artifactName: ClaudeCodeMax-Setup-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
publish:
  provider: github
  owner: countryboysplay
  repo: ClaudeCodeMax
