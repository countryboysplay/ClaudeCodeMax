name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run smoke
      # electron-builder uploads assets in parallel and each upload creates the release if it's
      # missing, which races into duplicate drafts. Create the draft first so they all find it.
      - run: gh release create "$env:GITHUB_REF_NAME" --draft --verify-tag --title "ClaudeCodeMax $($env:GITHUB_REF_NAME.TrimStart('v'))"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
